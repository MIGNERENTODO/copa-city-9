<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Copa City 9</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Copa City 9 · Torneo Interregional de Softbol de la Zona Centro de Chile. Resultados, tabla de posiciones, estadísticas, calendario y rosters.">
<meta name="theme-color" content="#041E42">
<meta property="og:title" content="Copa City 9 · Liga de La Ligua">
<meta property="og:description" content="Resultados, tabla de posiciones, estadísticas, calendario y rosters del Torneo Interregional de Softbol.">
<meta property="og:image" content="assets/logos/copacity9-cartel.jpg">
<link rel="icon" href="assets/logos/copacity9.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: big-league portal. Navy masthead + club bar + scoreboard ticker, white content cards on a cool grey field, red as the single accent. */
:root{
  --navy:#041E42; --navy-2:#0A2D5E; --navy-ink:#FFFFFF; --navy-mute:#AFC0DA;
  --red:#BF0D3E; --red-ink:#FFFFFF;
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FB; --line:#D9DEE6; --ink:#0D1B2E; --muted:#5A6779;
  --win:#167A47; --loss:#BF0D3E; --tie:#7A8699;
  --warn-bg:#FFF4D6; --warn-ink:#6B4A00;
  --shadow:0 1px 2px rgba(4,30,66,.06),0 4px 14px rgba(4,30,66,.06);
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --body:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#020D1F; --navy-2:#0A2246; --navy-ink:#FFFFFF; --navy-mute:#9DB0CD;
  --red:#E8335C; --red-ink:#FFFFFF;
  --bg:#07101E; --surface:#0F1B2E; --surface-2:#14233A; --line:#22344F; --ink:#E8EDF5; --muted:#97A6BC;
  --win:#3CC07D; --loss:#F0566F; --tie:#8A97AB;
  --warn-bg:#3A2E0B; --warn-ink:#FFE19A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --navy:#020D1F; --navy-2:#0A2246; --navy-ink:#FFFFFF; --navy-mute:#9DB0CD;
  --red:#E8335C; --red-ink:#FFFFFF;
  --bg:#07101E; --surface:#0F1B2E; --surface-2:#14233A; --line:#22344F; --ink:#E8EDF5; --muted:#97A6BC;
  --win:#3CC07D; --loss:#F0566F; --tie:#8A97AB;
  --warn-bg:#3A2E0B; --warn-ink:#FFE19A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
.tab-nums,table{font-variant-numeric:tabular-nums}

/* ---------- Masthead ---------- */
.mast{background:var(--navy);color:var(--navy-ink)}
.mast-in{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.brand>span{min-width:0;overflow:hidden}
.brand img{width:52px;height:52px;object-fit:contain;flex:0 0 auto}
.brand b{display:block;font-family:var(--display);font-weight:800;font-style:italic;font-size:26px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--navy-mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mast-links{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip-link{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid rgba(255,255,255,.22);border-radius:999px;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--navy-ink);white-space:nowrap}
.chip-link:hover{background:rgba(255,255,255,.1)}
.chip-link svg{width:15px;height:15px}
.nav{background:var(--navy-2);color:var(--navy-ink);border-top:1px solid rgba(255,255,255,.08)}
.nav-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;padding:12px 12px 10px;font-family:var(--display);font-weight:700;font-size:15.5px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--navy-mute);border-bottom:3px solid transparent}
.nav a:hover{color:var(--navy-ink)}
.nav a.on{color:var(--navy-ink);border-bottom-color:var(--red)}

/* ---------- Club bar ---------- */
.clubs{background:var(--surface);border-bottom:1px solid var(--line)}
.clubs-in{display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:thin;justify-content:space-between}
.clubs a{flex:0 0 auto;display:grid;place-items:center;width:52px;height:46px;border-radius:8px}
.clubs a:hover{background:var(--surface-2)}
.clubs img{width:40px;height:40px;object-fit:contain}

/* ---------- Ticker ---------- */
.ticker{background:var(--surface-2);border-bottom:1px solid var(--line)}
.ticker-in{display:flex;gap:10px;overflow-x:auto;padding-block:10px;scrollbar-width:thin}
.tk{flex:0 0 auto;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-decoration:none;display:grid;gap:4px}
.tk-h{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tk-h .fin{color:var(--red)}
.tk-r{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.tk-r img{width:22px;height:22px;object-fit:contain}
.tk-r span{flex:1}
.tk-r b{font-family:var(--display);font-size:18px;min-width:18px;text-align:right}
.tk-r.lose{color:var(--muted)}
.tk-r.lose b{font-weight:600}

.demo{background:var(--warn-bg);color:var(--warn-ink);font-size:13.5px}
.demo .wrap{padding-block:9px;display:flex;gap:10px;align-items:baseline}
.demo b{font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-size:14px;white-space:nowrap}

/* ---------- Page ---------- */
main{padding-block:24px 48px;display:grid;gap:28px}
main>*,.page-head>*{min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.page-head h1{font-size:clamp(34px,5vw,52px);font-weight:800;font-style:italic;text-transform:uppercase;line-height:.95}
.lede{color:var(--muted);max-width:62ch;margin:6px 0 0}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font-size:24px;font-weight:800;text-transform:uppercase;font-style:italic}
.more{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);text-decoration:none;white-space:nowrap}
.more:hover{text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.pad{padding:18px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.empty h3{font-size:20px;color:var(--ink);text-transform:uppercase;margin-bottom:4px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:0;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.07em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.btn-red{background:var(--red);color:var(--red-ink)}
.btn-ghost{background:transparent;border:1.5px solid currentColor}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-family:var(--display);font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--navy);color:var(--navy-ink)}
select{max-width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.logo-s{width:26px;height:26px;object-fit:contain;flex:0 0 auto}
.logo-m{width:44px;height:44px;object-fit:contain;flex:0 0 auto}
.ini{display:grid;place-items:center;border-radius:50%;color:#fff;font-family:var(--display);font-weight:800;flex:0 0 auto}

/* ---------- Hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.feature{position:relative;overflow:hidden;border-radius:var(--r);min-height:380px;display:flex;align-items:flex-end;background:var(--navy);color:#fff;box-shadow:var(--shadow)}
.feature>img.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 35%}
.feature::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,30,66,.05) 20%,rgba(4,30,66,.88) 72%,rgba(4,30,66,.97))}
.feature-in{position:relative;z-index:1;padding:24px;display:grid;gap:10px}
.feature .tag{display:inline-block;background:var(--red);color:#fff;font-family:var(--display);font-weight:700;letter-spacing:.12em;font-size:13px;text-transform:uppercase;padding:4px 10px;border-radius:4px;justify-self:start}
.feature h1{font-size:clamp(38px,6vw,64px);font-weight:800;font-style:italic;text-transform:uppercase;line-height:.92}
.feature p{margin:0;max-width:56ch;color:#D8E1EE}
.feature .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.feature .btn-ghost{color:#fff}
.feature .crest{position:absolute;z-index:1;top:16px;right:16px;width:120px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
.next .game{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.next .game:first-of-type{border-top:0}
.team-mini{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;font-size:14px}
.team-mini span{overflow:hidden;text-overflow:ellipsis}
.team-mini.right{flex-direction:row-reverse;text-align:right}
.vs{font-family:var(--display);font-weight:700;color:var(--muted);font-size:13px;text-align:center;line-height:1.2}
.vs b{display:block;color:var(--ink);font-size:16px}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:10px 8px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th.l,td.l{text-align:left}
tbody tr:hover td{background:var(--surface-2)}
td.teamcell a{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600}
td.rank{color:var(--muted);font-weight:700;width:28px}
td.pts{font-weight:800;font-family:var(--display);font-size:17px}
th.sortable{cursor:pointer}
th.sorted{color:var(--red)}
.racha{display:inline-flex;gap:3px}
.racha i{width:18px;height:18px;border-radius:4px;display:inline-grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:700;color:#fff}
.racha .G{background:var(--win)} .racha .P{background:var(--loss)} .racha .E{background:var(--tie)}
.ab{display:none}
@media (max-width:640px){.full{display:none}.ab{display:inline}}

/* ---------- Leaders ---------- */
.leaders{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.lead h3{font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 16px 0;display:flex;justify-content:space-between}
.lead h3 small{font-family:var(--body);font-size:11.5px;letter-spacing:0;text-transform:none;font-weight:500}
.lead-top{display:flex;align-items:center;gap:12px;padding:12px 16px}
.lead-top .val{margin-left:auto;font-family:var(--display);font-weight:800;font-size:38px;line-height:1;color:var(--ink)}
.lead-top .who{min-width:0}
.lead-top .who b{display:block;font-size:16px;line-height:1.2}
.lead ol{list-style:none;margin:0;padding:0 16px 12px;counter-reset:l 1}
.lead li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;counter-increment:l}
.lead li::before{content:counter(l);width:16px;color:var(--muted);font-weight:700;font-size:12px}
.lead li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead li b{font-variant-numeric:tabular-nums}
.photo{object-fit:cover;border-radius:50%;flex:0 0 auto;background:var(--surface-2)}

/* ---------- Schedule ---------- */
.day{display:grid;gap:10px}
.day-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.day-h h2{font-size:22px;font-weight:800;text-transform:uppercase}
.day-h span{color:var(--muted);font-weight:600}
.match{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 16px}
.match+.match{border-top:1px solid var(--line)}
.match .team-mini{font-size:15px}
.score{font-family:var(--display);font-weight:800;font-size:24px;display:flex;gap:10px;align-items:center}
.score .l{color:var(--muted);font-weight:600}
.score small{font-size:12px;letter-spacing:.1em;color:var(--red);font-family:var(--body);font-weight:700}
.meta{text-align:right;font-size:13px;color:var(--muted);line-height:1.35}
.meta b{color:var(--ink)}
.meta a{color:var(--red);font-weight:600}
@media (max-width:640px){.match{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.match .meta{grid-column:1/-1;text-align:left;display:flex;gap:10px;flex-wrap:wrap}}

/* ---------- Teams ---------- */
.teams{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.team-card{text-decoration:none;overflow:hidden;display:grid}
.team-card .band{height:108px;display:grid;place-items:center;position:relative}
.team-card .band img{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,0,0,.35))}
.team-card .info{padding:12px 14px}
.team-card b{font-family:var(--display);font-size:20px;font-weight:800;text-transform:uppercase;display:block;line-height:1.1}
.team-banner{border-radius:var(--r);overflow:hidden;color:#fff;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;padding:24px;box-shadow:var(--shadow)}
.team-banner img{width:clamp(96px,16vw,150px);height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))}
.team-banner h1{font-size:clamp(32px,5vw,54px);font-weight:800;font-style:italic;text-transform:uppercase;line-height:.95}
.team-banner .rec{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.team-banner .rec div{display:grid}
.team-banner .rec b{font-family:var(--display);font-size:28px;line-height:1}
.team-banner .rec span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
@media (max-width:520px){.team-banner{grid-template-columns:1fr}}
.roster{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr))}
.pl{overflow:hidden;display:grid}
.pl .ph{aspect-ratio:4/5;max-width:100%;position:relative;background:var(--surface-2)}
.pl .ph img{width:100%;height:100%;object-fit:cover}
.pl .ph .num{position:absolute;left:8px;bottom:8px;background:var(--navy);color:#fff;font-family:var(--display);font-weight:800;font-size:18px;padding:1px 8px;border-radius:4px}
.pl .ph .ini{position:absolute;inset:0;border-radius:0;font-size:44px}
.pl .tx{padding:10px 12px;display:grid;gap:2px}
.pl .tx b{font-size:15px;line-height:1.2}
.pl .pos{font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.pl .st{font-size:12.5px;color:var(--muted)}
.staff{display:flex;gap:10px;flex-wrap:wrap}
.staff div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.staff span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ---------- Spotlight / people ---------- */
.spot{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);overflow:hidden}
.spot>img{width:100%;height:100%;object-fit:cover;object-position:center 20%;min-height:280px}
.spot .tx{padding:24px;display:grid;gap:12px;align-content:start}
.spot h2{font-size:clamp(28px,4vw,40px);font-weight:800;font-style:italic;text-transform:uppercase;line-height:1}
.spot .cargo{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.spot p{margin:0;max-width:66ch}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills span{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
@media (max-width:700px){.spot{grid-template-columns:1fr}.spot>img{max-height:420px}}
.people{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.person{padding:18px;display:flex;gap:14px;align-items:center}
.person b{display:block;font-size:16px}
.dir-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.dir{overflow:hidden;display:grid;align-content:start}
.dir>img{width:100%;aspect-ratio:4/5;max-width:100%;object-fit:cover;object-position:top}
.dir .tx{padding:14px 16px;display:grid;gap:3px}
.dir .cargo{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.dir b{font-family:var(--display);font-size:24px;font-weight:800;text-transform:uppercase;line-height:1.05}
.dir .apodo{font-weight:600;color:var(--muted)}
.person .cargo{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}

/* ---------- Polls & predictions ---------- */
.poll{padding:18px;display:grid;gap:12px;align-content:start}
.grid.g2,.grid.g3{align-items:start}
.poll h3{font-family:var(--body);font-size:18px;font-weight:700;letter-spacing:0}
.state{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:4px;justify-self:start}
.state.open{background:var(--win);color:#fff}
.state.closed{background:var(--tie);color:#fff}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar{grid-column:1/-1;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--navy)}
:root .opt.lead .bar i{background:var(--red)}
.prob{padding:16px;display:grid;gap:12px}
.prob-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.prob-teams .pct{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.prob-bar{display:flex;height:10px;border-radius:999px;overflow:hidden}
.pick{font-size:13.5px;background:var(--surface-2);border-radius:8px;padding:10px 12px;border-left:3px solid var(--red)}

/* ---------- Rules ---------- */
.art{padding:18px 20px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.art .no{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.08em;color:var(--red);text-transform:uppercase;padding-top:3px;white-space:nowrap}

<script>
(function(){
"use strict";
var S = window.SITIO || {};
S.equipos = S.equipos || []; S.calendario = S.calendario || []; S.rosters = S.rosters || {};
var LIGA = S.liga || {};

/* ================= Utilidades ================= */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

function fcorta(f){ var d=fdate(f); return d? DIA[d.getDay()]+" "+d.getDate()+" "+MES[d.getMonth()] : "Por confirmar"; }

/* ================= Equipos ================= */
var T={}; S.equipos.forEach(function(t){ T[t.id]=t; });

    for(var k=0;k<(t.alias||[]).length;k++){ var a=norm(t.alias[k]); if(a.length>3 && (" "+nn+" ").indexOf(" "+a)>=0) return t.id; } }

    for(var k2=0;k2<(t.alias||[]).length;k2++){ if(norm(t.alias[k2])===nn) return t.id; } }

/* ================= Fotos ================= */

function lev(a,b){ if(a===b) return 0; var m=a.length,n2=b.length; if(!m) return n2; if(!n2) return m; var v=[],i,j; for(j=0;j<=n2;j++) v[j]=j;

function construir(raw){

  M.players={}; DB.jugadores.forEach(function(j){ var num=String(j.numero||"").trim(), lead=String(j.nombre||"").match(/^\s*(\d+)/); if(!num&&lead) num=lead[1];
    M.players[j.id]={id:j.id,nombre:nom(j.nombre),numero:num,posicion:j.posicion||"",equipo:tm[j.equipoId]}; });
  M.games=DB.juegos.map(function(g){ return {id:g.id,fecha:g.fecha,local:tm[g.localId],visita:tm[g.visitaId],cl:n(g.cl),cv:n(g.cv),lineas:g.lineas||[],lineasP:g.lineasP||[]}; })
    .filter(function(g){ return g.local&&g.visita; }).sort(function(a,b){ return String(a.fecha).localeCompare(String(b.fecha)); });
  /* Unir calendario con resultados */
  var usados={};
  function par(g,c){ return (g.local===c.local&&g.visita===c.visita)||(g.local===c.visita&&g.visita===c.local); }
  cal.forEach(function(c){

      if(usados[g.id]) continue;

  });
  /* Juegos reprogramados: mismo cruce, otra fecha */

    if(best){ c.juego=best; usados[best.id]=1; c.reprog=true; c.fecha=best.fecha; } });
  M.games.forEach(function(g){ if(!usados[g.id]) cal.push({jornada:null,fecha:g.fecha,hora:"",sede:"",local:g.local,visita:g.visita,juego:g}); });
  cal.forEach(function(c){ if(!c.sede) c.sede=LIGA.sede||""; });

function score(g,tid){ return g.local===tid?{pro:g.cl,riv:g.cv}:{pro:g.cv,riv:g.cl}; }
function tabla(){

      var x=s.pro>s.riv?"G":(s.pro<s.riv?"P":"E"); r[x.toLowerCase()]++; r.racha.push(x); });

  return h+'</section>';
};

};

/* ================= Marco ================= */
function marco(ruta){
  document.getElementById("nav").innerHTML=NAV.map(function(x){ var on=ruta===x[0]||(x[0]==="equipos"&&ruta==="equipo"); return '<a href="#'+x[0]+'"'+(on?' class="on" aria-current="page"':'')+'>'+x[1]+'</a>'; }).join("");
}
function piezasFijas(){
  document.getElementById("brandSub").textContent=(LIGA.nombre||"Liga de La Ligua")+" · "+(LIGA.subtitulo||"Softbol");
  var r=S.redes||{}, ml='';
  (r.instagram||[]).slice(0,1).forEach(function(x){ ml+='<a class="chip-link" href="'+esc(x.url)+'" target="_blank" rel="noopener">'+ICON_CAM+esc(x.usuario)+'</a>'; });
  (r.youtube||[]).slice(0,1).forEach(function(x){ ml+='<a class="chip-link" href="'+esc(x.url)+'" target="_blank" rel="noopener">'+ICON_PLAY+'En vivo</a>'; });
  document.getElementById("mastLinks").innerHTML=ml;
  document.getElementById("clubs").innerHTML=S.equipos.filter(function(t){return t.logo;}).map(function(t){ return '<a href="#equipo-'+esc(t.id)+'" title="'+esc(t.nombre)+'" aria-label="'+esc(t.nombre)+'"><img src="'+esc(t.logo)+'" alt=""></a>'; }).join("");
  var tk=M.cal.filter(function(c){return c.juego;}).slice(-10).reverse().map(function(c){ var g=c.juego, w=g.cl>g.cv?g.local:(g.cv>g.cl?g.visita:null);
      var row=function(tid,v){ return '<div class="tk-r'+(w&&w!==tid?" lose":"")+'">'+logo(tid)+'<span>'+esc(teamOf(tid).abrev)+'</span><b>'+v+'</b></div>'; };
      return '<a class="tk" href="#calendario"><div class="tk-h"><span>'+esc(fcorta(g.fecha))+'</span><span class="fin">Final</span></div>'+row(g.visita,g.cv)+row(g.local,g.cl)+'</a>'; });
  var up=proximos().slice(0,6).map(function(c){ return '<a class="tk" href="#calendario"><div class="tk-h"><span>'+esc(fcorta(c.fecha))+'</span><span>'+esc(c.hora||"")+'</span></div><div class="tk-r">'+logo(c.visita)+'<span>'+esc(teamOf(c.visita).abrev)+'</span></div><div class="tk-r">'+logo(c.local)+'<span>'+esc(teamOf(c.local).abrev)+'</span></div></a>'; });
  var all=up.concat(tk);
  document.getElementById("tickerBox").hidden=!all.length;
  document.getElementById("ticker").innerHTML=up.join("")+tk.join("");
  document.getElementById("demo").hidden=!M.demo;
  var y=(S.redes||{});
  document.getElementById("foot").innerHTML='<div style="display:flex;gap:12px;align-items:center"><img src="assets/logos/copacity9.png" alt="" style="width:64px"><div><b style="color:var(--navy-ink);font-family:var(--display);font-size:20px;text-transform:uppercase;font-style:italic">Copa City 9</b><br>Organiza la '+esc(LIGA.nombre||"Liga de La Ligua")+'.<br>'+(M.ultimo?'Datos al '+esc(flarga(M.ultimo)).toLowerCase()+'.':'Temporada '+esc(LIGA.temporada||""))+'<br><span class="visitas" id="visitas" hidden></span></div></div>'+
    '<div><h4>Secciones</h4><ul>'+NAV.slice(1,6).map(function(x){return '<li><a href="#'+x[0]+'">'+x[1]+'</a></li>';}).join("")+'</ul></div>'+
    '<div><h4>Más</h4><ul>'+NAV.slice(6).map(function(x){return '<li><a href="#'+x[0]+'">'+x[1]+'</a></li>';}).join("")+'</ul></div>'+
    '<div><h4>Síguenos</h4><ul>'+(y.instagram||[]).map(function(x){return '<li><a href="'+esc(x.url)+'" target="_blank" rel="noopener">Instagram · '+esc(x.nombre)+'</a></li>';}).join("")+(y.youtube||[]).map(function(x){return '<li><a href="'+esc(x.url)+'" target="_blank" rel="noopener">YouTube · '+esc(x.nombre)+'</a></li>';}).join("")+'</ul></div>';
}
function ruta(){
  var h=(location.hash||"").replace(/^#/,"")||"inicio";
  if(h.indexOf("equipo-")===0) return {v:"equipo",id:h.slice(7)};
  if(h.indexOf("articulo-")===0) return {v:"articulo",id:h.slice(9)};
  if(/^j\d+$/.test(h)) return {v:"calendario",ancla:h};
  return {v:V[h]?h:"inicio"};
}
var ULTIMA="";
function render(keepScroll){
  var r=ruta(), app=document.getElementById("app");
  marco(r.v==="articulo"?"noticias":r.v);
  var html=r.v==="equipo"?V.equipo(r.id):(r.v==="articulo"?V.articulo(r.id):V[r.v]());
  if(r.v==="inicio"||r.v==="galeria"||r.v==="directiva") html+='<section>'+secH("Síguenos")+'<div class="social">'+socialList()+'</div></section>';
  app.innerHTML=html;
  var key=r.v+(r.id||"")+(r.ancla||"");
  if(!keepScroll && key!==ULTIMA){ var an=r.ancla&&document.getElementById(r.ancla); if(an) an.scrollIntoView(); else window.scrollTo(0,0); }
  ULTIMA=key;
  var ap=null; if(r.v==="articulo") (M.pubs||[]).forEach(function(x){ if(x.id===r.id) ap=x; });
  var t=r.v==="articulo"?(ap?ap.titulo:"Noticias"):r.v==="equipo"?teamOf(r.id).nombre:(NAV.filter(function(x){return x[0]===r.v;})[0]||[,"Inicio"])[1];
  document.title=(r.v==="inicio"?"Copa City 9":t+" · Copa City 9");
}

/* ================= Galería ampliada ================= */
var LB=-1, LBL=null;
function lb(i,lista){
  if(lista) LBL=lista; var G=LBL||galeria(), el=document.getElementById("lb");
  if(i<0||!G.length){ el.hidden=true; LB=-1; LBL=null; return; }
  LB=(i+G.length)%G.length; var f=G[LB];
  el.innerHTML='<div class="lb-top"><span>'+esc(f.pie)+(G.length>1?' · '+(LB+1)+'/'+G.length:'')+'</span><button data-act="lbx" aria-label="Cerrar">Cerrar ✕</button></div><div class="lb-main"><img src="'+esc(f.src)+'" alt="'+esc(f.pie)+'"></div><div class="lb-nav">'+(G.length>1?'<button data-act="lbp">← Anterior</button><button data-act="lbn">Siguiente →</button>':'')+'</div>';
  el.hidden=false;
}

/* ================= Eventos ================= */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]"); if(!b) return;
  var a=b.getAttribute("data-act"), v=b.getAttribute("data-v");
  if(a==="sort"){ UI.sort.bat=v; render(true); }
  else if(a==="votar"){ votar(b); }
  else if(a==="foto"){ lb(n(b.getAttribute("data-i")),galeria()); }
  else if(a==="aimg"){ lb(n(b.getAttribute("data-i")),AIMG.slice()); }
  else if(a==="ntipo"){ UI.ntipo=v||""; render(true); }
  else if(a==="lbx"){ lb(-1); }
  else if(a==="lbp"){ lb(LB-1); }
  else if(a==="lbn"){ lb(LB+1); }
});
document.getElementById("lb").addEventListener("click",function(e){ if(e.target.id==="lb"||e.target.classList.contains("lb-main")) lb(-1); });
document.addEventListener("change",function(e){
  var k=e.target.getAttribute("data-ui"); if(!k) return;
  if(k==="eq") UI.eq=e.target.value; if(k==="calif") UI.calif=e.target.checked;
  render(true);
});
document.addEventListener("keydown",function(e){
  if(LB<0) return;
  if(e.key==="Escape") lb(-1); else if(e.key==="ArrowRight") lb(LB+1); else if(e.key==="ArrowLeft") lb(LB-1);
});
document.addEventListener("submit",function(e){ if(e.target.id!=="fSug") return; e.preventDefault(); enviarSugerencia(e.target); });
window.addEventListener("hashchange",function(){ render(false); });

/* ================= Música ================= */
var ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
function musica(){
  var m=S.musica||{}, el=document.getElementById("music"); if(!m.archivo) return;
  var au=new Audio(m.archivo), off=false; au.loop=true; au.volume=+m.volumen||0.45; au.preload="auto";
  try{ off=localStorage.getItem("cc9-musica")==="off"; }catch(e){}
  function pintar(){ var on=!au.paused; el.className="music"+(on?" playing":"");
    el.innerHTML='<button type="button" aria-pressed="'+on+'" aria-label="'+(on?"Pausar":"Reproducir")+' la canción de la Copa City 9"><span class="mi">'+(on?ICON_PAUSE:ICON_PLAY)+'</span>'+(on?'<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>':'')+'<span class="t">'+(on?'':'Escuchar · ')+esc(m.titulo||"Canción oficial")+'</span></button>'; }
  el.hidden=false; pintar(); au.addEventListener("play",pintar); au.addEventListener("pause",pintar);
  au.addEventListener("error",function(){ el.hidden=true; });
  el.addEventListener("click",function(){ if(au.paused){ off=false; try{localStorage.removeItem("cc9-musica");}catch(e){} au.play().catch(function(){}); } else { off=true; try{localStorage.setItem("cc9-musica","off");}catch(e){} au.pause(); } });
  if(off) return;
  au.play().catch(function(){
    var tipos=["pointerdown","keydown","touchstart"];
    var go=function(ev){ if(el.contains(ev.target)) return; tipos.forEach(function(t){ document.removeEventListener(t,go,true); }); if(!off) au.play().catch(function(){}); };
    tipos.forEach(function(t){ document.addEventListener(t,go,true); });
  });
}

/* ================= Arranque ================= */
function iniciar(raw){ try{ construir(raw); }catch(err){ construir(null); } piezasFijas(); render(false); contarVisita(); musica(); }
function estatico(){ return fetch("datos/estadisticas.json",{cache:"no-store"}).then(function(r){ if(!r.ok) throw 0; return r.json(); }).catch(function(){ return window.ESTADISTICAS||null; }); }
fetch("api/contenido",{cache:"no-store"}).then(function(r){ if(!r.ok) throw 0; return r.json(); })
  .then(function(c){ M.pubs=Array.isArray(c.publicaciones)?c.publicaciones:[]; M.encuestas=Array.isArray(c.encuestas)?c.encuestas:null; M.prog=Array.isArray(c.programacion)?c.programacion:null; M.galeria=Array.isArray(c.galeria)?c.galeria:[]; return c.estadisticas||estatico(); })
  .catch(function(){ return estatico(); })
  .then(function(j){ iniciar(j); });
})();
</script>
